name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.0)"
        required: true
        type: string

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-14
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SKIALIN_MAVEN_REPO_URL: ${{ secrets.SKIALIN_MAVEN_REPO_URL }}
      SKIALIN_MAVEN_REPO_USERNAME: ${{ secrets.SKIALIN_MAVEN_REPO_USERNAME }}
      SKIALIN_MAVEN_REPO_PASSWORD: ${{ secrets.SKIALIN_MAVEN_REPO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfreetype-dev libfontconfig1-dev

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - run: chmod +x gradlew

      - name: Resolve Skia submodule commit
        run: git -C external/skia rev-parse HEAD > .skia-commit

      - name: Cache Skia build
        uses: actions/cache@v4
        with:
          path: |
            external/skia/out
            external/skia/third_party/externals
            external/skia/bin
          key: skia-${{ matrix.name }}-${{ hashFiles('.skia-commit', 'native-shim/args.gn') }}
          restore-keys: |
            skia-${{ matrix.name }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-release-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ matrix.name }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ matrix.name }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-release-${{ matrix.name }}-

      - name: Sync Skia third-party deps
        working-directory: external/skia
        run: python3 tools/git-sync-deps

      - name: Fetch gn
        working-directory: external/skia
        run: python3 bin/fetch-gn

      - name: Fetch ninja
        working-directory: external/skia
        run: python3 bin/fetch-ninja

      - name: Build Skia
        run: ./gradlew buildSkia --console=plain

      - name: Test
        run: ./gradlew test -Pskialin.buildNative=true --console=plain

      - name: Publish
        run: ./gradlew publish -Pskialin.buildNative=true -Pskialin.version=${{ inputs.version }} --console=plain
