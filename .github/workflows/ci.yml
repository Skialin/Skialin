name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-14
          - name: macos-x64
            os: macos-13
          - name: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - run: chmod +x gradlew

      - name: Resolve Skia submodule commit
        run: git -C external/skia rev-parse HEAD > .skia-commit

      - name: Cache Skia build
        uses: actions/cache@v4
        with:
          path: |
            external/skia/out
            external/skia/third_party/externals
            external/skia/bin
          key: skia-${{ matrix.name }}-${{ hashFiles('.skia-commit', 'native-shim/args.gn') }}
          restore-keys: |
            skia-${{ matrix.name }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.name }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.name }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ matrix.name }}-

      - name: Sync Skia third-party deps
        working-directory: external/skia
        run: python3 tools/git-sync-deps

      - name: Fetch gn
        working-directory: external/skia
        run: python3 bin/fetch-gn

      - name: Fetch ninja
        working-directory: external/skia
        run: python3 bin/fetch-ninja

      - name: Build Skia
        run: ./gradlew buildSkia --console=plain

      - name: ktlint
        run: ./gradlew ktlintCheck --console=plain

      - name: Build, test, publish (local repo)
        run: ./gradlew test publish -Pskialin.buildNative=true --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: skialin-${{ matrix.name }}
          path: build/publishing-repo
