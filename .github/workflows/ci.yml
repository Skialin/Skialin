name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-14
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig1-dev libgl1-mesa-dev mesa-common-dev

      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - run: chmod +x gradlew

      - name: Resolve Skia submodule commit
        run: git -C external/skia rev-parse HEAD > .skia-commit

      - name: Cache Skia build
        id: cache-skia
        uses: actions/cache@v4
        with:
          path: |
            external/skia/out
            external/skia/third_party/externals
            external/skia/bin
          key: skia-${{ matrix.name }}-${{ hashFiles('.skia-commit', 'native-shim/args.gn') }}
          restore-keys: |
            skia-${{ matrix.name }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.name }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.name }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ matrix.name }}-

      - name: Sync Skia third-party deps
        working-directory: external/skia
        run: python3 tools/git-sync-deps

      - name: Fetch gn
        working-directory: external/skia
        run: python3 bin/fetch-gn

      - name: Fetch ninja
        working-directory: external/skia
        run: python3 bin/fetch-ninja

      - name: Fix mtimes on restored Skia cache
        run: |
          # actions/checkout stamps every source file with "now", and
          # git-sync-deps/fetch-gn/fetch-ninja above can similarly touch
          # files under third_party/externals and bin even when their
          # content is unchanged. Ninja then sees those inputs as newer
          # than the cached out/Release objects and rebuilds from scratch.
          # Run this last, right before ninja runs, and cover every path
          # the Skia cache step restores so nothing upstream re-dirties it.
          for dir in external/skia/out external/skia/third_party/externals external/skia/bin; do
            if [ -d "$dir" ]; then
              find "$dir" -exec touch -c {} +
            fi
          done

      - name: Build Skia
        run: ./gradlew buildSkia --console=plain

      - name: Build, test, publish (local repo)
        run: ./gradlew test publish -Pskialin.buildNative=true --console=plain

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            hs_err_pid*.log
            replay_pid*.log
            build/reports/tests/test
          if-no-files-found: ignore

      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop

      - uses: actions/upload-artifact@v4
        with:
          name: skialin-${{ matrix.name }}
          path: build/publishing-repo
